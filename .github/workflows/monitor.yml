name: Strategy Monitor - 5-hour live tracking

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Start or stop the selected strategy monitor"
        required: true
        type: choice
        default: start
        options:
          - start
          - stop
      strategy:
        description: "Live rank from Strategy Lab HTML top 20 (recalculated at each five-hour batch)"
        required: true
        type: choice
        default: "TOP_1"
        options:
          - "TOP_1"
          - "TOP_2"
          - "TOP_3"
          - "TOP_4"
          - "TOP_5"
          - "TOP_6"
          - "TOP_7"
          - "TOP_8"
          - "TOP_9"
          - "TOP_10"
          - "TOP_11"
          - "TOP_12"
          - "TOP_13"
          - "TOP_14"
          - "TOP_15"
          - "TOP_16"
          - "TOP_17"
          - "TOP_18"
          - "TOP_19"
          - "TOP_20"
      bar:
        description: "AUTO uses the strategy timeframe shown in its name"
        required: false
        type: choice
        default: "AUTO"
        options:
          - "AUTO"
          - "5m"
          - "15m"
          - "30m"
          - "1H"
          - "4H"
          - "1D"
      inst_id:
        description: "OKX Spot USDT instrument, e.g. SOL-USDT"
        required: false
        type: string
        default: "SOL-USDT"

permissions:
  contents: write
  actions: write

concurrency:
  group: zied-strategy-monitor-single-session
  cancel-in-progress: true

jobs:
  stop:
    if: ${{ inputs.action == 'stop' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitor state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure state commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install monitor dependencies
        run: python -m pip install -r requirements.txt
      - name: Mark monitor as stopped
        run: python monitor.py --stop

  monitor:
    if: ${{ inputs.action == 'start' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout persistent monitor state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure state commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install monitor dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate monitor source
        run: python -m py_compile monitor.py strategy_lab.py
      - name: Follow selected strategy for five hours
        env:
          STRATEGY_CHOICE: ${{ inputs.strategy }}
          MONITOR_BAR: ${{ inputs.bar }}
          MONITOR_INST_ID: ${{ inputs.inst_id }}
        run: |
          set -euo pipefail
          python monitor.py --run \
            --strategy-choice "$STRATEGY_CHOICE" \
            --bar "$MONITOR_BAR" \
            --inst-id "$MONITOR_INST_ID"
      - name: Continue with the next five-hour workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          STRATEGY_CHOICE: ${{ inputs.strategy }}
          MONITOR_BAR: ${{ inputs.bar }}
          MONITOR_INST_ID: ${{ inputs.inst_id }}
        run: |
          gh workflow run monitor.yml --ref main \
            -f action=start \
            -f strategy="$STRATEGY_CHOICE" \
            -f bar="$MONITOR_BAR" \
            -f inst_id="$MONITOR_INST_ID"
          echo "The next five-hour monitoring batch has been queued."
