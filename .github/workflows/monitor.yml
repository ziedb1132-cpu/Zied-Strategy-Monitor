name: Strategy Monitor - 5-hour live tracking

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Start or stop the selected strategy monitor"
        required: true
        type: choice
        default: start
        options:
          - start
          - stop
      strategy:
        description: "Choose a validated BUY strategy from Strategy Lab"
        required: false
        type: choice
        default: "86e25944685d — SOL USDT Buy · EMA + EMA · 86e25944685d · 4H"
        options:
          - "86e25944685d — SOL USDT Buy · EMA + EMA · 86e25944685d · 4H"
          - "72f829a08612 — SOL USDT Buy · Volume + EMA · 72f829a08612 · 1D"
          - "84e88cf85ea4 — SOL USDT Buy · EMA + EMA · 84e88cf85ea4 · 4H"
          - "a5f9ca3671ca — SOL USDT Buy · Bollinger + SMA · a5f9ca3671ca · 1D"
          - "c5ee9fd3298e — SOL USDT Buy · Trend + Roc · c5ee9fd3298e · 4H"
          - "4ec0f1f622de — SOL USDT Buy · EMA + SMA · 4ec0f1f622de · 4H"
          - "6d7f0c8ee2fb — SOL USDT Buy · EMA + SMA · 6d7f0c8ee2fb · 1D"
          - "23cb75f59fb0 — SOL USDT Buy · SMA + EMA · 23cb75f59fb0 · 4H"
          - "e0e0453982ba — SOL USDT Buy · SMA + Volatility · e0e0453982ba · 1D"
          - "a3698789b8ac — SOL USDT Buy · Volume + RSI · a3698789b8ac · 1D"
          - "26dc5dc1e5b9 — SOL USDT Buy · RSI + SMA · 26dc5dc1e5b9 · 1D"
          - "64afc5bfff22 — SOL USDT Buy · SMA + SMA · 64afc5bfff22 · 1D"
          - "1b9d52d0562e — SOL USDT Buy · Bollinger + Trend · 1b9d52d0562e · 1D"
          - "070e240a9a65 — SOL USDT Buy · SMA + EMA · 070e240a9a65 · 1D"
          - "75290c1dc011 — SOL USDT Buy · SMA + EMA · 75290c1dc011 · 1D"
          - "e0b4e55426d9 — SOL USDT Buy · EMA + Bollinger · e0b4e55426d9 · 4H"
          - "4e136a753091 — SOL USDT Buy · Roc + EMA · 4e136a753091 · 4H"
          - "1ff9c64611a5 — SOL USDT Buy · EMA + Momentum · 1ff9c64611a5 · 1D"
          - "b241d282523d — SOL USDT Buy · EMA + EMA · b241d282523d · 4H"
          - "59c1d61c44c3 — SOL USDT Buy · EMA + SMA · 59c1d61c44c3 · 4H"
      bar:
        description: "AUTO uses the strategy timeframe shown in its name"
        required: false
        type: choice
        default: "AUTO"
        options:
          - "AUTO"
          - "5m"
          - "15m"
          - "30m"
          - "1H"
          - "4H"
          - "1D"
      inst_id:
        description: "OKX Spot USDT instrument, e.g. SOL-USDT"
        required: false
        type: string
        default: "SOL-USDT"

permissions:
  contents: write
  actions: write

concurrency:
  group: zied-strategy-monitor-single-session
  cancel-in-progress: true

jobs:
  stop:
    if: ${{ inputs.action == 'stop' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitor state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install monitor dependencies
        run: python -m pip install -r requirements.txt
      - name: Mark monitor as stopped
        run: python monitor.py --stop

  monitor:
    if: ${{ inputs.action == 'start' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout persistent monitor state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install monitor dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate monitor source
        run: python -m py_compile monitor.py strategy_lab.py
      - name: Follow selected strategy for five hours
        env:
          STRATEGY_CHOICE: ${{ inputs.strategy }}
          MONITOR_BAR: ${{ inputs.bar }}
          MONITOR_INST_ID: ${{ inputs.inst_id }}
        run: |
          set -euo pipefail
          python monitor.py --run \
            --strategy-choice "$STRATEGY_CHOICE" \
            --bar "$MONITOR_BAR" \
            --inst-id "$MONITOR_INST_ID"
      - name: Continue with the next five-hour workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          STRATEGY_CHOICE: ${{ inputs.strategy }}
          MONITOR_BAR: ${{ inputs.bar }}
          MONITOR_INST_ID: ${{ inputs.inst_id }}
        run: |
          gh workflow run monitor.yml --ref main \
            -f action=start \
            -f strategy="$STRATEGY_CHOICE" \
            -f bar="$MONITOR_BAR" \
            -f inst_id="$MONITOR_INST_ID"
          echo "The next five-hour monitoring batch has been queued."
